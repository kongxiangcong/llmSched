[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sched"
version = "0.1.0"
description = "Architecture evaluation compiler for RISC-V plus NPU workloads."
requires-python = ">=3.11"
dependencies = [
  "onnx>=1.20,<2",
  "pydantic>=2.12,<3",
  "typer>=0.24,<0.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[project.scripts]
llm-sched = "llm_sched.cli.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "local_smoke: representative smoke subset for local iteration",
  "milestone_matrix: broader matrix smoke for milestone and nightly closure",
]
